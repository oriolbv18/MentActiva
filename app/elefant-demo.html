<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>L'Elefant · galeria</title>
<link rel="stylesheet" href="css/estils.css"><link rel="stylesheet" href="css/elefant.css">
<style>
  body { padding: 1rem; background: var(--fons, #f6f2ea); color: var(--text, #1f2a24); font-family: var(--font, system-ui); }
  h1 { font-size: 1.4rem; } h2 { font-size: 1.05rem; margin: 1.2rem 0 .4rem; }
  .fila { display: flex; flex-wrap: wrap; gap: .4rem; } .fila button { min-height: 44px; padding: .3rem .8rem; border-radius: .6rem; border: 2px solid #2e8b57; background: #fff; color: #1f2a24; font: 600 .95rem system-ui; cursor: pointer; }
  .fila button[aria-pressed="true"] { background: #2e8b57; color: #fff; }
  .escena { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 18rem); gap: 1rem; align-items: start; }
  .gran { position: relative; min-height: 18rem; display: grid; place-items: end center; padding-top: 5rem; border-radius: 1rem; background: var(--superficie, #fff); border: 2px solid #d6e5da; }
  .objectius { display: flex; gap: .6rem; flex-wrap: wrap; } .obj { width: 4rem; height: 4rem; border-radius: .6rem; background: #fdebd2; border: 2px solid #f2a65a; display: grid; place-items: center; font-weight: 800; color: #1f2a24; }
  .mides { display: flex; gap: 1.2rem; align-items: end; flex-wrap: wrap; }
  html[data-tema="fosc"] body { background: #1f221f; color: #eee; } html[data-tema="fosc"] .gran { background: #2a2e2a; border-color: #3f463f; }
  @media (max-width: 700px) { .escena { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>L'Elefant · galeria de revisió <small style="font-weight:400;font-size:.8rem">(v1.9 · eina per a l'Oriol)</small></h1>
<div class="escena">
  <div class="gran" id="escenari"></div>
  <div class="objectius" id="objectius" aria-label="Objectius per assenyalar"><button class="obj" type="button">A</button><button class="obj" type="button">B</button><button class="obj" type="button">C</button><button class="obj" type="button">D</button></div>
</div>
<h2>Estats</h2><div class="fila" id="estats"></div>
<h2>Mirada, trompa i veu</h2>
<div class="fila" id="accions">
  <button type="button" data-a="mira-jugador">Mira el jugador</button><button type="button" data-a="mira-cursor">Segueix el cursor</button><button type="button" data-a="senyala">Assenyala A</button><button type="button" data-a="senyala-b">Assenyala B</button><button type="button" data-a="senyala-d">Assenyala D</button><button type="button" data-a="para-senyalar">Deixa d'assenyalar</button>
  <button type="button" data-a="diu">Digues alguna cosa</button><button type="button" data-a="pista">Vols una pista? (amb botons)</button><button type="button" data-a="veu" aria-pressed="false">Veu: no</button><button type="button" data-a="tema">Tema clar/fosc</button><button type="button" data-a="moviment" aria-pressed="false">Sense moviment</button>
</div>
<h2>Vestuari</h2><div class="fila" id="vestuari"></div>
<h2>Mides i silueta a 48 px</h2>
<div class="mides" id="mides"></div>
<script src="js/elefant/elefant-dibuix.js"></script><script src="js/elefant/elefant-motor.js"></script>
<script>
const e = Elefant.crea(document.getElementById('escenari'), { mida: 'gran', rol: 'flotant' });
window.e = e;
const ESTATS = Object.keys(Elefant.ESTATS), ACC = ['bufanda', 'barret', 'ulleres', 'gorra', 'llaçada', 'barret-festa', 'paraigua'];
const $ = id => document.getElementById(id);
$('estats').innerHTML = ESTATS.map(s => `<button type="button" data-estat="${s}">${s}</button>`).join('');
$('vestuari').innerHTML = ACC.map(s => `<button type="button" data-acc="${s}" aria-pressed="false">${s}</button>`).join('');
$('estats').onclick = ev => { const b = ev.target.closest('button'); if (b) e.estat(b.dataset.estat); };
$('vestuari').onclick = ev => { const b = ev.target.closest('button'); if (!b) return; const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); e.vesteix(b.dataset.acc, on); };
let seguir = false; document.addEventListener('pointermove', ev => { if (seguir) e.mira(ev.clientX, ev.clientY); });
const objs = [...document.querySelectorAll('.obj')];
$('accions').onclick = ev => {
  const b = ev.target.closest('button'); if (!b) return; const a = b.dataset.a;
  if (a === 'mira-jugador') { seguir = false; e.miraAlJugador(); }
  else if (a === 'mira-cursor') { seguir = true; }
  else if (a === 'senyala') e.assenyala(objs[0], { durada: 6000 }); else if (a === 'senyala-b') e.assenyala(objs[1], { durada: 6000 }); else if (a === 'senyala-d') e.assenyala(objs[3], { durada: 6000 });
  else if (a === 'para-senyalar') e.deixaDAssenyalar();
  else if (a === 'diu') e.diu('Bon dia! Avui toca Memory?', { emocio: 'saluda' });
  else if (a === 'pista') e.diu('Vols una pista?', { emocio: 'pensant', accions: [{ text: 'Sí', principal: true }, { text: 'Ara no' }] });
  else if (a === 'veu') { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); b.textContent = 'Veu: ' + (on ? 'sí' : 'no'); }
  else if (a === 'tema') { const h = document.documentElement; if (h.dataset.tema === 'fosc') h.removeAttribute('data-tema'); else h.dataset.tema = 'fosc'; }
  else if (a === 'moviment') { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); e.estatic(on); b.textContent = on ? 'Moviment: no' : 'Sense moviment'; }
};
const m = $('mides'); ['mini', 'mitjana'].forEach(t => { const d = document.createElement('div'); m.appendChild(d); Elefant.crea(d, { mida: t, animat: false, rol: 'flotant' }); });
const s = document.createElement('div'); m.appendChild(s); const sil = Elefant.crea(s, { mida: 'mini', animat: false }); sil.el.style.setProperty('--el-ample', '48px');
</script>
</body></html>
